<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线上购药系统演示</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>线上购药系统</h1>
        <p>药品查询浏览、购物车订单、智能药师咨询演示</p>
      </div>
      <nav>
        <button data-view="medicines" class="nav-btn active">药品</button>
        <button data-view="cart" class="nav-btn">购物车</button>
        <button data-view="orders" class="nav-btn">订单</button>
        <button data-view="consult" class="nav-btn">AI药师</button>
      </nav>
    </header>

    <main>
      <section id="medicines" class="view active">
        <div class="toolbar">
          <input id="keyword" placeholder="搜索药品、症状、批准文号或厂家" />
          <select id="category"></select>
          <select id="prescriptionType">
            <option value="">全部类型</option>
            <option value="OTC">OTC</option>
            <option value="PRESCRIPTION">处方药</option>
          </select>
          <select id="sort">
            <option value="comprehensive">综合排序</option>
            <option value="sales_desc">销量优先</option>
            <option value="price_asc">价格升序</option>
            <option value="price_desc">价格降序</option>
          </select>
          <button id="searchBtn">查询</button>
        </div>
        <div id="medicineList" class="medicine-grid"></div>
        <aside id="medicineDetail" class="detail-panel"></aside>
      </section>

      <section id="cart" class="view">
        <div class="section-head">
          <h2>购物车</h2>
          <button id="checkoutBtn">生成订单</button>
        </div>
        <div id="cartList"></div>
        <div id="cartSummary" class="summary"></div>
        <div id="orderPreview" class="preview"></div>
      </section>

      <section id="orders" class="view">
        <div class="section-head">
          <h2>订单状态</h2>
          <button id="refreshOrdersBtn">刷新</button>
        </div>
        <div id="orderList"></div>
      </section>

      <section id="consult" class="view consult-layout">
        <div class="consult-main">
          <div class="boundary">
            AI智能药师仅提供辅助解释和风险提示，不替代医生诊断或执业药师处方审核；高风险问题会提示转人工。
          </div>
          <div id="chatMessages" class="chat"></div>
          <div class="chat-input">
            <input id="consultInput" placeholder="例如：感冒灵颗粒怎么吃？孕妇能不能用阿莫西林？" />
            <button id="sendConsultBtn">发送</button>
            <button id="handoffBtn">转人工</button>
          </div>
        </div>
        <aside>
          <h2>咨询记录</h2>
          <div id="consultRecords"></div>
        </aside>
      </section>
    </main>

    <div id="toast"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
